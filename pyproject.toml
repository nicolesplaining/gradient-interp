[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradient-interp"
version = "0.1.0"
description = "Forecast and intervene on batch updates with sparse gradient dictionaries"
requires-python = ">=3.11"
authors = [{name = "Nicole Ma"}]
dependencies = ["numpy>=1.26,<3", "torch>=2.4,<3", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
hf = ["transformers>=4.56,<6", "peft>=0.14,<1"]
loracle = ["gradient-interp[hf]", "pandas>=2.2,<4", "pyyaml>=6,<7"]
study = ["gradient-interp[loracle]", "pyarrow>=18,<27"]
report = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
gradient-interp = "gradient_interp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
